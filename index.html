<style>
:root {
  /* Lehrmittel-Layout: Kopfzeile, links Themenverzeichnis, rechts Inhaltsverzeichnis als Liste; Nugget als Leseseite */
  --paper: #fcfcfa;
  --ink: #1d2124;
  --muted: #5f676b;
  --rule: #dfe2df;
  --accent: #2f5d50;
  --accent-tint: #edf3f0;
  --ags: #9a6a12;
  --fage: #2f5f95;
  --hf: #84406f;
  --ok: #2c7a4b;
  --bad: #a8402f;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #161a1b; --ink: #e6e8e6; --muted: #a2aaa8; --rule: #2e3537;
    --accent: #8cc2ad; --accent-tint: #1f2c28;
    --ags: #e3b866; --fage: #8fb5e3; --hf: #dba0c9; --ok: #79c99a; --bad: #ec9a8b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #161a1b; --ink: #e6e8e6; --muted: #a2aaa8; --rule: #2e3537;
  --accent: #8cc2ad; --accent-tint: #1f2c28;
  --ags: #e3b866; --fage: #8fb5e3; --hf: #dba0c9; --ok: #79c99a; --bad: #ec9a8b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 17px/1.6 var(--sans); }
h1, h2, h3 { font-family: var(--serif); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

/* Kopf */
.masthead { border-bottom: 1px solid var(--rule); }
.masthead .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 22px; padding-bottom: 18px; }
.logo { font-family: var(--serif); font-size: 28px; font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
.logo span { color: var(--accent); }
.levels { display: flex; gap: 22px; font-size: 15.5px; }
.levels button { color: var(--muted); padding: 4px 0; border-bottom: 2px solid transparent; }
.levels button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-color: var(--accent); }

.intro { padding: 44px 0 30px; display: grid; grid-template-columns: 1fr; gap: 10px; }
.intro h1 { font-size: clamp(30px, 4.6vw, 44px); max-width: 20ch; }
.intro p { color: var(--muted); max-width: 58ch; margin: 0; font-size: 18px; }

/* Verzeichnis */
.layout { display: grid; grid-template-columns: 200px 1fr; gap: 48px; padding-bottom: 64px; }
.side { position: sticky; top: 20px; align-self: start; display: grid; gap: 22px; }
.side h2 { font-family: var(--sans); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.topics { display: grid; gap: 2px; }
.topics button { text-align: left; padding: 5px 0; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; }
.topics button span { font-variant-numeric: tabular-nums; }
.topics button[aria-pressed="true"] { color: var(--ink); font-weight: 700; }
#search { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 6px 0; }
#search:focus { outline: none; border-color: var(--accent); }
.progress { font-size: 15px; color: var(--muted); }
.progress b { color: var(--ink); font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--rule); margin-top: 8px; }
.bar i { display: block; height: 100%; background: var(--accent); }

.group + .group { margin-top: 40px; }
.group h2 { font-size: 24px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.item { display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 16px; padding: 18px 0; border-bottom: 1px solid var(--rule); text-decoration: none; color: inherit; }
.item:hover h3 { color: var(--accent); }
.num { font-family: var(--serif); font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
.item h3 { font-size: 21px; transition: color .15s; }
.item p { margin: 4px 0 0; color: var(--muted); font-size: 16px; max-width: 60ch; }
.item .side-meta { text-align: right; font-size: 14px; color: var(--muted); white-space: nowrap; }
.item .check { color: var(--ok); font-weight: 700; display: block; }
.lv { font-size: 14px; font-weight: 700; margin-top: 8px; display: flex; gap: 14px; }
.lv span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: currentColor; margin-right: 6px; vertical-align: 1px; }
.lv .AGS { color: var(--ags); } .lv .FaGe { color: var(--fage); } .lv .HF { color: var(--hf); }
.empty { color: var(--muted); padding: 24px 0; }

/* Leseseite */
.article { max-width: 680px; margin: 0 auto; padding: 36px 0 80px; }
.back { font-size: 15px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--accent); }
.kicker { margin-top: 30px; font-size: 14px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.kicker .lv { margin: 0; }
.article h1 { font-size: clamp(32px, 5vw, 46px); margin: 10px 0 16px; }
.lead { font-family: var(--serif); font-size: 21px; line-height: 1.5; color: var(--ink); margin: 0; }
.article h2 { font-size: 24px; margin: 44px 0 14px; }
.points { margin: 0; padding-left: 22px; }
.points li { margin: 8px 0; padding-left: 4px; }
.points li::marker { color: var(--accent); }
.merke { margin: 28px 0 0; padding: 4px 0 4px 20px; border-left: 3px solid var(--accent); }
.merke b { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.role { display: grid; grid-template-columns: 90px 1fr; gap: 6px 16px; margin: 0; }
.role dt { font-weight: 700; }
.role dt.AGS { color: var(--ags); } .role dt.FaGe { color: var(--fage); } .role dt.HF { color: var(--hf); }
.role dd { margin: 0; }
.q { padding: 18px 0; border-top: 1px solid var(--rule); }
.q:last-of-type { border-bottom: 1px solid var(--rule); }
.q p { margin: 0 0 12px; font-weight: 700; }
.q p small { color: var(--muted); font-weight: 400; margin-right: 6px; }
.opts { display: grid; gap: 6px; }
.opts button { text-align: left; display: grid; grid-template-columns: 30px 1fr; align-items: baseline; padding: 8px 10px; border-radius: 6px; }
.opts button:hover:not(:disabled) { background: var(--accent-tint); }
.opts button .k { font-family: var(--serif); font-weight: 600; color: var(--muted); }
.opts button.right { background: var(--accent-tint); color: var(--ok); font-weight: 700; }
.opts button.right .k { color: var(--ok); }
.opts button.wrong { color: var(--bad); text-decoration: line-through; }
.opts button:disabled { cursor: default; }
.fb { font-size: 15.5px; color: var(--muted); margin: 10px 0 0 40px; }
.result { margin-top: 18px; font-weight: 700; }
.transfer { background: var(--accent-tint); padding: 18px 20px; border-radius: 4px; margin: 0; }
.src { margin-top: 44px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 14px; }
.next { margin-top: 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 15px; }
.next a { text-decoration: none; }

footer { border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
footer .wrap { padding-top: 18px; padding-bottom: 32px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; gap: 24px; }
  .side { position: static; }
  .topics { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .topics button span { display: none; }
  .item { grid-template-columns: 34px 1fr; }
  .item .side-meta { grid-column: 2; text-align: left; }
  .item .check { display: inline; margin-left: 10px; }
  .levels { gap: 16px; }
}
@media (prefers-reduced-motion: reduce) { .item h3 { transition: none; } }
</style>
</head>

    points: [
      "Sieben Parameter: Atemfrequenz, Sauerstoffsättigung, Sauerstoffgabe, systolischer Blutdruck, Puls, Bewusstsein (ACVPU), Temperatur",
      "Score 1 bis 4: Überwachung verstärken, Fachperson beurteilt",
      "Score 3 in einem einzelnen Parameter: zeitnahe ärztliche Beurteilung",
      "Score 5 bis 6: dringende ärztliche Beurteilung",
      "Score 7 und mehr: Notfallreaktion"
    ],
    merke: "Neue Verwirrtheit zählt beim Bewusstsein (C in ACVPU) direkt 3 Punkte.",
    levelNotes: { HF: "Du berechnest den Score, interpretierst ihn im Kontext und löst die passende Eskalation aus." },
    quiz: [
      { q: "Ein Patient hat einen NEWS2 von 5. Was ist angezeigt?", o: ["Weiter wie bisher", "Dringende ärztliche Beurteilung", "Sofort Reanimation"], a: 1, e: "5 bis 6 Punkte verlangen eine dringende ärztliche Beurteilung." },
      { q: "Ein Patient ist neu verwirrt, sonst sind alle Werte normal. Wie viele Punkte gibt das?", o: ["0", "1", "3"], a: 2, e: "Neue Verwirrtheit ergibt 3 Punkte in einem Parameter und löst eine zeitnahe Beurteilung aus." }
    ],
    transfer: "Berechne für einen Patienten deiner Bezugsgruppe den NEWS2 aus den aktuellen Werten. Passt das Ergebnis zu deinem klinischen Eindruck?",
    src: "Royal College of Physicians: National Early Warning Score (NEWS) 2"
  }
];


const LEVEL_LABEL = { AGS: "AGS", FaGe: "FaGe", HF: "Pflege HF" };
const state = { level: "Alle", topic: "Alle", q: "" };
let done = {};
try { done = JSON.parse(localStorage.getItem("pp-done") || "{}"); } catch (e) { done = {}; }
try { const l = localStorage.getItem("pp-level"); if (l) state.level = l; } catch (e) {}
const save = () => { try { localStorage.setItem("pp-done", JSON.stringify(done)); localStorage.setItem("pp-level", state.level); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TOPICS = [...new Set(NUGGETS.map(n => n.topic))];
const levelsHtml = ls => `<span class="lv">${ls.map(l => `<span class="${l}">${LEVEL_LABEL[l]}</span>`).join("")}</span>`;
const pool = () => NUGGETS.filter(n => state.level === "Alle" || n.levels.includes(state.level));

function renderIndex() {
  const q = state.q.toLowerCase();
  const list = pool().filter(n => (state.topic === "Alle" || n.topic === state.topic) &&
    (!q || (n.title + " " + n.teaser + " " + n.points.join(" ")).toLowerCase().includes(q)));
  const p = pool(), d = p.filter(n => done[n.id]).length;
  const groups = TOPICS.map(t => [t, list.filter(n => n.topic === t)]).filter(([, ns]) => ns.length);
  $("#app").innerHTML = `
    <section class="wrap intro">
      <h1>Pflegewissen in kleinen Einheiten</h1>
      <p>Jedes Nugget dauert drei bis sechs Minuten: Kernpunkte lesen, Wissen im Quiz prüfen und auf die eigene Station übertragen. Für AGS, FaGe und Studierende Pflege HF.</p>
    </section>
    <div class="wrap layout">
      <aside class="side">
        <div><label for="search" class="side-label" style="position:absolute;left:-9999px">Suchen</label>
          <input id="search" type="search" placeholder="Suchen" value="${esc(state.q)}"></div>
        <div><h2>Themen</h2><div class="topics" role="group" aria-label="Thema">
          ${["Alle", ...TOPICS].map(t => `<button data-topic="${t}" aria-pressed="${t === state.topic}">${t === "Alle" ? "Alle Themen" : t}<span>${(t === "Alle" ? p : p.filter(n => n.topic === t)).length}</span></button>`).join("")}
        </div></div>
        <div class="progress"><b>${d} von ${p.length}</b> abgeschlossen<div class="bar"><i style="width:${p.length ? d / p.length * 100 : 0}%"></i></div></div>
      </aside>
      <div>${groups.length ? groups.map(([t, ns]) => `
        <section class="group"><h2>${t}</h2>
          ${ns.map(n => `<a class="item" href="#${n.id}">
            <span class="num">${String(NUGGETS.indexOf(n) + 1).padStart(2, "0")}</span>
            <span><h3>${esc(n.title)}</h3><p>${esc(n.teaser)}</p>${levelsHtml(n.levels)}</span>
            <span class="side-meta">${n.min} Min.${done[n.id] ? '<span class="check">✓ erledigt</span>' : ""}</span>
          </a>`).join("")}
        </section>`).join("") : `<p class="empty">Kein Nugget passt zu dieser Auswahl.</p>`}
      </div>
    </div>`;
  $(".topics").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.topic = b.dataset.topic; renderIndex(); } });
  const s = $("#search");
  s.addEventListener("input", e => { state.q = e.target.value; renderIndex(); const n = $("#search"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
}

function renderNugget(n) {
  const i = NUGGETS.indexOf(n), prev = NUGGETS[i - 1], next = NUGGETS[i + 1];
  const roles = Object.entries(n.levelNotes).filter(([l]) => state.level === "Alle" || state.level === l);
  $("#app").innerHTML = `
    <article class="wrap"><div class="article">
      <a class="back" href="#">← Alle Nuggets</a>
      <div class="kicker"><span>${n.topic}</span><span>${n.min} Minuten</span>${levelsHtml(n.levels)}</div>
      <h1>${esc(n.title)}</h1>
      <p class="lead">${esc(n.lead)}</p>
      <h2>Kernpunkte</h2>
      <ul class="points">${n.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      <div class="merke"><b>Merke</b>${esc(n.merke)}</div>
      ${roles.length ? `<h2>Deine Rolle</h2><dl class="role">${roles.map(([l, t]) => `<dt class="${l}">${LEVEL_LABEL[l]}</dt><dd>${esc(t)}</dd>`).join("")}</dl>` : ""}
      <h2>Quiz</h2>
      ${n.quiz.map((q, qi) => `<div class="q"><p><small>${qi + 1}/${n.quiz.length}</small>${esc(q.q)}</p>
        <div class="opts">${q.o.map((o, j) => `<button data-q="${qi}" data-o="${j}"><span class="k">${"ABC"[j]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <p class="fb" id="fb${qi}" style="font-weight:400"></p></div>`).join("")}
      <p class="result" id="result"></p>
      <h2>Praxistransfer</h2>
      <p class="transfer">${esc(n.transfer)}</p>
      <p class="src">Grundlagen: ${esc(n.src)}</p>
      <nav class="next">${prev ? `<a href="#${prev.id}">← ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a href="#${next.id}">${esc(next.title)} →</a>` : ""}</nav>
    </div></article>`;
  let answered = 0, right = 0;
  document.querySelectorAll(".opts button").forEach(b => b.addEventListener("click", () => {
    const qi = +b.dataset.q, oi = +b.dataset.o, q = n.quiz[qi];
    const group = b.parentElement.querySelectorAll("button");
    group.forEach(x => x.disabled = true);
    group[q.a].classList.add("right");
    if (oi !== q.a) b.classList.add("wrong"); else right++;
    $("#fb" + qi).textContent = (oi === q.a ? "Richtig. " : "Nicht ganz. ") + q.e;
    if (++answered === n.quiz.length) {
      const all = right === n.quiz.length;
      $("#result").textContent = `${right} von ${n.quiz.length} richtig. ` + (all ? "Nugget abgeschlossen." : "Lies die Kernpunkte nochmals und versuche es später erneut.");
      if (all) { done[n.id] = true; save(); }
    }
  }));
  window.scrollTo(0, 0);
}

function route() {
  const n = NUGGETS.find(x => x.id === location.hash.slice(1));
  n ? renderNugget(n) : renderIndex();
  document.title = n ? n.title + " | Pflegepedia" : "Pflegepedia";
}
document.querySelector(".levels").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.level = b.dataset.level; save();
  document.querySelectorAll(".levels button").forEach(x => x.setAttribute("aria-pressed", x === b));
  route();
});
document.querySelectorAll(".levels button").forEach(x => x.setAttribute("aria-pressed", x.dataset.level === state.level));
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
