<style>
:root {
  /* Layout: Kopf mit Stufenwahl, Filterleiste, Raster aus Nugget-Karten, Nugget öffnet als Lesepanel */
  --bg: #f4f7f7;
  --surface: #ffffff;
  --ink: #15292e;
  --muted: #56696d;
  --line: #d8e2e3;
  --accent: #0f6e74;
  --accent-soft: #e0f0f0;
  --ags: #8a5a00; --ags-bg: #fbefd6;
  --fage: #1f5fa8; --fage-bg: #e2ecf8;
  --hf: #7a2e6b; --hf-bg: #f4e3f0;
  --ok: #1d7a43; --ok-bg: #e2f4ea;
  --bad: #b03a2e; --bad-bg: #fbe6e3;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a1c; --surface: #172528; --ink: #e5eeee; --muted: #9fb2b4; --line: #2a3d40;
    --accent: #5cc2c6; --accent-soft: #1d3a3c;
    --ags: #f0c26a; --ags-bg: #3a2d12; --fage: #8db8ec; --fage-bg: #1a2c42; --hf: #e3a2d4; --hf-bg: #3a1f35;
    --ok: #6fd39a; --ok-bg: #173526; --bad: #f19a8f; --bad-bg: #3d1e1a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a1c; --surface: #172528; --ink: #e5eeee; --muted: #9fb2b4; --line: #2a3d40;
  --accent: #5cc2c6; --accent-soft: #1d3a3c;
  --ags: #f0c26a; --ags-bg: #3a2d12; --fage: #8db8ec; --fage-bg: #1a2c42; --hf: #e3a2d4; --hf-bg: #3a1f35;
  --ok: #6fd39a; --ok-bg: #173526; --bad: #f19a8f; --bad-bg: #3d1e1a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

header { padding: 32px 0 20px; border-bottom: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 { font-size: clamp(30px, 5vw, 44px); letter-spacing: -0.02em; }
.brand h1 span { color: var(--accent); }
.tagline { color: var(--muted); margin: 6px 0 20px; max-width: 62ch; }
.levels { display: flex; gap: 8px; flex-wrap: wrap; }
.levels button { border: 1.5px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 999px; font-weight: 600; }
.levels button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 18px 0 8px; }
.bar input { flex: 1 1 240px; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; }
.topics { display: flex; gap: 6px; flex-wrap: wrap; }
.topics button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 15px; }
.topics button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.progress { color: var(--muted); font-size: 15px; padding: 4px 0 16px; font-variant-numeric: tabular-nums; }
.progress b { color: var(--ink); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; padding-bottom: 48px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card .topic { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.card h3 { font-size: 21px; }
.card p { margin: 0; color: var(--muted); font-size: 15.5px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: auto; padding-top: 6px; }
.chip { font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.chip.AGS { color: var(--ags); background: var(--ags-bg); }
.chip.FaGe { color: var(--fage); background: var(--fage-bg); }
.chip.HF { color: var(--hf); background: var(--hf-bg); }
.time { font-size: 13.5px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.done { font-size: 12.5px; font-weight: 700; color: var(--ok); background: var(--ok-bg); padding: 3px 9px; border-radius: 999px; }
.empty { color: var(--muted); padding: 30px 0; }

/* Lesepanel */
.overlay { position: fixed; inset: 0; background: rgba(10, 20, 22, .45); display: none; justify-content: flex-end; z-index: 10; }
.overlay.open { display: flex; }
.panel { background: var(--surface); width: min(720px, 100%); height: 100%; overflow-y: auto; padding: 28px clamp(18px, 4vw, 44px) 60px; box-shadow: -10px 0 30px rgba(0,0,0,.15); }
.panel .close { float: right; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; font-weight: 600; }
.panel h2 { font-size: clamp(26px, 4vw, 34px); margin: 8px 0 10px; }
.panel .lead { color: var(--muted); max-width: 62ch; }
.panel h4 { font-family: var(--font-display); font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin: 28px 0 10px; }
.panel ol, .panel ul { padding-left: 22px; margin: 0; max-width: 62ch; }
.panel li { margin: 6px 0; }
.merke { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 12px 16px; border-radius: 0 10px 10px 0; margin-top: 22px; max-width: 62ch; }
.merke b { color: var(--accent); }
.levelnote { margin-top: 10px; font-size: 15.5px; max-width: 62ch; }
.q { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
.q p { margin: 0 0 10px; font-weight: 600; }
.opts { display: grid; gap: 8px; }
.opts button { text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 12px; }
.opts button.right { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); font-weight: 600; }
.opts button.wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.opts button:disabled { cursor: default; }
.fb { font-size: 15px; margin-top: 8px; color: var(--muted); }
.transfer { background: var(--bg); border: 1px dashed var(--line); border-radius: 12px; padding: 14px 16px; max-width: 62ch; }
.result { margin-top: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.src { font-size: 14px; color: var(--muted); margin-top: 28px; max-width: 62ch; }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; padding: 18px 0 30px; }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><h1>Pflege<span>pedia</span></h1></div>
    <p class="tagline">Kurze Lerneinheiten für AGS, FaGe und Pflege HF. Ein Nugget dauert 3 bis 6 Minuten: Kernpunkte lesen, Wissen im Quiz prüfen, auf die eigene Station übertragen.</p>
    <div class="levels" role="group" aria-label="Ausbildungsstufe">
      <button data-level="Alle" aria-pressed="true">Alle Stufen</button>
      <button data-level="AGS" aria-pressed="false">AGS</button>
      <button data-level="FaGe" aria-pressed="false">FaGe</button>
      <button data-level="HF" aria-pressed="false">Pflege HF</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="bar">
    <label for="search" class="sr" style="position:absolute;left:-9999px">Suchen</label>
    <input id="search" type="search" placeholder="Nugget suchen, z. B. Braden, SBAR, Puls">
    <div class="topics" id="topics" role="group" aria-label="Thema"></div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="grid" id="grid"></div>
</main>

<footer><div class="wrap">Pflegepedia, Prototyp. Inhalte sind Beispiele und werden vor dem Einsatz fachlich geprüft.</div></footer>

<div class="overlay" id="overlay"><article class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="ptitle"></article></div>

    levelNotes: { HF: "Du berechnest den Score, interpretierst ihn im Kontext und löst die passende Eskalation aus." },
    quiz: [
      { q: "Ein Patient hat einen NEWS2 von 5. Was ist angezeigt?", o: ["Weiter wie bisher", "Dringende ärztliche Beurteilung", "Sofort Reanimation"], a: 1, e: "5 bis 6 Punkte verlangen eine dringende ärztliche Beurteilung." },
      { q: "Ein Patient ist neu verwirrt, sonst sind alle Werte normal. Wie viele Punkte gibt das?", o: ["0", "1", "3"], a: 2, e: "Neue Verwirrtheit ergibt 3 Punkte in einem Parameter und löst eine zeitnahe Beurteilung aus." }
    ],
    transfer: "Berechne für einen Patienten deiner Bezugsgruppe den NEWS2 aus den aktuellen Werten. Passt das Ergebnis zu deinem klinischen Eindruck?",
    src: "Royal College of Physicians: National Early Warning Score (NEWS) 2"
  }
];

const LEVEL_LABEL = { AGS: "AGS", FaGe: "FaGe", HF: "Pflege HF" };
const state = { level: "Alle", topic: "Alle", q: "" };
let done = {};
try { done = JSON.parse(localStorage.getItem("pp-done") || "{}"); } catch (e) { done = {}; }
function saveDone() { try { localStorage.setItem("pp-done", JSON.stringify(done)); } catch (e) {} }

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderTopics() {
  const topics = ["Alle", ...new Set(NUGGETS.map(n => n.topic))];
  $("#topics").innerHTML = topics.map(t => `<button data-topic="${t}" aria-pressed="${t === state.topic}">${t === "Alle" ? "Alle Themen" : t}</button>`).join("");
}

function visible() {
  const q = state.q.toLowerCase();
  return NUGGETS.filter(n =>
    (state.level === "Alle" || n.levels.includes(state.level)) &&
    (state.topic === "Alle" || n.topic === state.topic) &&
    (!q || (n.title + " " + n.teaser + " " + n.points.join(" ")).toLowerCase().includes(q)));
}

function renderGrid() {
  const list = visible();
  const pool = NUGGETS.filter(n => state.level === "Alle" || n.levels.includes(state.level));
  const doneCount = pool.filter(n => done[n.id]).length;
  $("#progress").innerHTML = `<b>${doneCount} von ${pool.length}</b> Nuggets abgeschlossen${state.level !== "Alle" ? " für " + LEVEL_LABEL[state.level] : ""}`;
  $("#grid").innerHTML = list.length ? list.map(n => `
    <button class="card" data-id="${n.id}">
      <span class="topic">${n.topic}</span>
      <h3>${esc(n.title)}</h3>
      <p>${esc(n.teaser)}</p>
      <span class="meta">${n.levels.map(l => `<span class="chip ${l}">${LEVEL_LABEL[l]}</span>`).join("")}
        ${done[n.id] ? '<span class="done">Erledigt</span>' : ""}
        <span class="time">${n.min} Min.</span></span>
    </button>`).join("") : `<p class="empty">Kein Nugget passt zu diesem Filter.</p>`;
}

function openNugget(id) {
  const n = NUGGETS.find(x => x.id === id);
  if (!n) return;
  const notes = Object.entries(n.levelNotes)
    .filter(([l]) => state.level === "Alle" || state.level === l)
    .map(([l, t]) => `<p class="levelnote"><span class="chip ${l}">${LEVEL_LABEL[l]}</span> ${esc(t)}</p>`).join("");
  $("#panel").innerHTML = `
    <button class="close" id="close">Schliessen</button>
    <span class="meta" style="margin:0">${n.levels.map(l => `<span class="chip ${l}">${LEVEL_LABEL[l]}</span>`).join("")}<span class="time" style="margin-left:6px">${n.topic}, ${n.min} Min.</span></span>
    <h2 id="ptitle">${esc(n.title)}</h2>
    <p class="lead">${esc(n.lead)}</p>
    <h4>Kernpunkte</h4>
    <ul>${n.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
    <div class="merke"><b>Merke:</b> ${esc(n.merke)}</div>
    <h4>Deine Rolle</h4>${notes}
    <h4>Quiz</h4>
    ${n.quiz.map((q, i) => `
      <div class="q" data-q="${i}"><p>${esc(q.q)}</p>
        <div class="opts">${q.o.map((o, j) => `<button data-q="${i}" data-o="${j}">${esc(o)}</button>`).join("")}</div>
        <div class="fb" id="fb${i}"></div></div>`).join("")}
    <div class="result" id="result"></div>
    <h4>Praxistransfer</h4>
    <div class="transfer">${esc(n.transfer)}</div>
    <p class="src">Grundlage: ${esc(n.src)}</p>`;
  let answered = 0, right = 0;
  $("#panel").querySelectorAll(".opts button").forEach(b => b.addEventListener("click", () => {
    const qi = +b.dataset.q, oi = +b.dataset.o, q = n.quiz[qi];
    const group = b.parentElement.querySelectorAll("button");
    group.forEach(x => x.disabled = true);
    group[q.a].classList.add("right");
    if (oi !== q.a) b.classList.add("wrong"); else right++;
    $("#fb" + qi).textContent = (oi === q.a ? "Richtig. " : "Nicht ganz. ") + q.e;
    answered++;
    if (answered === n.quiz.length) {
      $("#result").textContent = `${right} von ${n.quiz.length} richtig.` + (right === n.quiz.length ? " Nugget abgeschlossen." : " Lies die Kernpunkte nochmals und versuche es erneut.");
      if (right === n.quiz.length) { done[n.id] = true; saveDone(); renderGrid(); }
    }
  }));
  $("#close").addEventListener("click", closeNugget);
  $("#overlay").classList.add("open");
  $("#panel").scrollTop = 0;
  $("#close").focus();
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
}
function closeNugget() {
  $("#overlay").classList.remove("open");
  history.replaceState(null, "", location.pathname + location.search);
}

document.querySelector(".levels").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.level = b.dataset.level;
  document.querySelectorAll(".levels button").forEach(x => x.setAttribute("aria-pressed", x === b));
  renderGrid();
});
$("#topics").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  state.topic = b.dataset.topic; renderTopics(); renderGrid();
});
$("#search").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });
$("#grid").addEventListener("click", e => { const c = e.target.closest(".card"); if (c) openNugget(c.dataset.id); });
$("#overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeNugget(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#overlay").classList.contains("open")) closeNugget(); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); id ? openNugget(id) : closeNugget(); });

renderTopics(); renderGrid();
if (location.hash.length > 1) openNugget(location.hash.slice(1));
</script>
</body>
</html>
